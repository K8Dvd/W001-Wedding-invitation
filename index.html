    <!-- LINK PREVIEW (shown when the link is shared on Messenger, Viber, WhatsApp, Facebook, iMessage…)

         3) These must be edited HERE, not in data.ts, because link previews do not run JavaScript. -->

    <meta property="og:title" content="Alex & Kate — The Wedding" />
    <meta property="og:description" content="Saturday, December 18, 2027" />
